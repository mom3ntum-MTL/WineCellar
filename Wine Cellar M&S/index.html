<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cellar M&S Tracker</title>
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: {} }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Custom Scrollbar for the table */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .dark ::-webkit-scrollbar-thumb { background: #475569; }
    
    body { transition: background-color 0.3s, color 0.3s; }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 dark:bg-[#0b0f19] dark:text-slate-100 font-sans pb-12 antialiased">

  <header class="sticky top-0 z-30 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 px-4 py-3 shadow-sm">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
      
      <div class="flex items-center space-x-3">
        <div class="p-2 bg-rose-100 dark:bg-rose-950/80 border border-rose-200 dark:border-rose-500/30 rounded-xl text-rose-600 dark:text-rose-500">
          <i data-lucide="wine" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight">Cellar M&S</h1>
          <p class="text-xs text-slate-500 dark:text-slate-400">Total: <span id="bottleCount">0</span> Bottles</p>
        </div>
      </div>

      <div class="flex items-center space-x-2">
        <button onclick="toggleTheme()" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition">
          <i data-lucide="sun-moon" class="w-5 h-5"></i>
        </button>
        <button class="flex items-center space-x-1.5 px-3 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm transition shadow-md">
          <i data-lucide="scan" class="w-4 h-4"></i>
          <span class="hidden sm:inline">Scan Label</span>
        </button>
        <button class="flex items-center space-x-1.5 px-3 py-2 rounded-lg bg-rose-600 hover:bg-rose-700 text-white font-medium text-sm transition shadow-md">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span class="hidden sm:inline">Add Bottle</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6 space-y-4">
    
    <div class="flex flex-col md:flex-row gap-3">
      <div class="relative flex-1">
        <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-3 text-slate-400"></i>
        <input type="text" id="searchInput" placeholder="Search producer, cuvée, region..." class="w-full pl-10 pr-4 py-2 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-rose-500 transition">
      </div>
      
      <button onclick="toggleFilterMenu()" class="flex items-center justify-center space-x-2 px-4 py-2 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl text-sm font-medium hover:bg-slate-50 dark:hover:bg-slate-800 transition">
        <i data-lucide="filter" class="w-4 h-4"></i>
        <span>Filters</span>
      </button>
    </div>

    <div id="activeFiltersBar" class="flex flex-wrap gap-2 hidden">
      <span class="px-2.5 py-1 text-xs font-medium bg-rose-100 dark:bg-rose-900/50 text-rose-700 dark:text-rose-300 rounded-md border border-rose-200 dark:border-rose-800 flex items-center gap-1">
        Red Wine <i data-lucide="x" class="w-3 h-3 cursor-pointer"></i>
      </span>
      </div>

    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl overflow-hidden shadow-sm overflow-x-auto">
      <table class="w-full text-left text-sm whitespace-nowrap">
        <thead class="bg-slate-100 dark:bg-slate-800/50 text-slate-600 dark:text-slate-400 text-xs uppercase font-semibold border-b border-slate-200 dark:border-slate-700">
          <tr>
            <th class="px-4 py-3 cursor-pointer hover:text-rose-500 transition" onclick="sortData('producer')">Producer <i data-lucide="arrow-up-down" class="inline w-3 h-3"></i></th>
            <th class="px-4 py-3 cursor-pointer hover:text-rose-500 transition" onclick="sortData('cuvee')">Cuvée <i data-lucide="arrow-up-down" class="inline w-3 h-3"></i></th>
            <th class="px-4 py-3 cursor-pointer hover:text-rose-500 transition" onclick="sortData('vintage')">Vintage <i data-lucide="arrow-up-down" class="inline w-3 h-3"></i></th>
            <th class="px-4 py-3 cursor-pointer hover:text-rose-500 transition" onclick="sortData('category')">Category <i data-lucide="arrow-up-down" class="inline w-3 h-3"></i></th>
            <th class="px-4 py-3 cursor-pointer hover:text-rose-500 transition" onclick="sortData('region')">Region <i data-lucide="arrow-up-down" class="inline w-3 h-3"></i></th>
            <th class="px-4 py-3 cursor-pointer hover:text-rose-500 transition" onclick="sortData('quantity')">Qty <i data-lucide="arrow-up-down" class="inline w-3 h-3"></i></th>
            <th class="px-4 py-3 cursor-pointer hover:text-rose-500 transition" onclick="sortData('section')">Section <i data-lucide="arrow-up-down" class="inline w-3 h-3"></i></th>
          </tr>
        </thead>
        <tbody id="wineTableBody" class="divide-y divide-slate-100 dark:divide-slate-800">
          </tbody>
      </table>
    </div>

  </main>

  <div id="detailsModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-900 max-w-lg w-full rounded-2xl p-6 space-y-4 border border-slate-200 dark:border-slate-700 shadow-2xl">
      <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-3">
        <h3 id="modalTitle" class="font-bold text-lg">Wine Details</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-white">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      
      <div class="grid grid-cols-2 gap-4 text-sm" id="modalContent">
        </div>

      <div class="pt-4 flex gap-3">
        <button onclick="openModifyMode()" class="flex-1 py-2 bg-indigo-100 dark:bg-indigo-900/40 text-indigo-700 dark:text-indigo-300 border border-indigo-200 dark:border-indigo-700 rounded-lg font-medium hover:bg-indigo-200 dark:hover:bg-indigo-800 transition">
          Modify Information
        </button>
        <button class="flex-1 py-2 bg-rose-600 hover:bg-rose-500 text-white rounded-lg font-medium transition">
          Log 1 Consumed
        </button>
      </div>
    </div>
  </div>

  <script>
    // Mock Data based on your exact columns
    let mockInventory = [
      { id: "W-01", country: "France", region: "Pauillac", cuvee: "Grand Cru Classé", producer: "Château Lynch-Bages", vintage: 2010, category: "Red Wine", format: "750 mL", maturityStart: 2020, maturityEnd: 2038, price: "$185", value: "$220", quantity: 4, section: "A-01", dateAdded: "2023-10-01" },
      { id: "W-02", country: "France", region: "Champagne", cuvee: "Vintage Brut", producer: "Dom Pérignon", vintage: 2012, category: "Sparkling Wine", format: "750 mL", maturityStart: 2022, maturityEnd: 2040, price: "$260", value: "$280", quantity: 6, section: "B-04", dateAdded: "2024-01-15" }
    ];

    let sortCol = '';
    let sortAsc = true;

    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      renderTable();
    });

    // Theme Toggle
    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
    }

    // Render Table logic
    function renderTable() {
      const tbody = document.getElementById("wineTableBody");
      document.getElementById("bottleCount").innerText = mockInventory.reduce((acc, w) => acc + w.quantity, 0);
      
      tbody.innerHTML = mockInventory.map(wine => `
        <tr onclick="openDetails('${wine.id}')" class="hover:bg-slate-50 dark:hover:bg-slate-800/50 cursor-pointer transition">
          <td class="px-4 py-3 font-medium">${wine.producer}</td>
          <td class="px-4 py-3 text-slate-500 dark:text-slate-400">${wine.cuvee}</td>
          <td class="px-4 py-3">${wine.vintage}</td>
          <td class="px-4 py-3"><span class="px-2 py-1 text-[10px] rounded-md bg-slate-200 dark:bg-slate-800">${wine.category}</span></td>
          <td class="px-4 py-3">${wine.region}, ${wine.country}</td>
          <td class="px-4 py-3 font-bold">${wine.quantity}</td>
          <td class="px-4 py-3 font-mono text-xs">${wine.section}</td>
        </tr>
      `).join('');
    }

    // Sorting functionality
    function sortData(column) {
      if (sortCol === column) {
        sortAsc = !sortAsc;
      } else {
        sortCol = column;
        sortAsc = true;
      }
      
      mockInventory.sort((a, b) => {
        let valA = a[column];
        let valB = b[column];
        if (valA < valB) return sortAsc ? -1 : 1;
        if (valA > valB) return sortAsc ? 1 : -1;
        return 0;
      });
      
      renderTable();
    }

    // Modal Details functionality
    function openDetails(id) {
      const wine = mockInventory.find(w => w.id === id);
      document.getElementById('modalTitle').innerText = `${wine.producer} - ${wine.vintage}`;
      
      document.getElementById('modalContent').innerHTML = `
        <div><p class="text-xs text-slate-500">Cuvée</p><p class="font-medium">${wine.cuvee}</p></div>
        <div><p class="text-xs text-slate-500">Region</p><p class="font-medium">${wine.region}, ${wine.country}</p></div>
        <div><p class="text-xs text-slate-500">Style & Format</p><p class="font-medium">${wine.category} (${wine.format})</p></div>
        <div><p class="text-xs text-slate-500">Drink Window</p><p class="font-medium">${wine.maturityStart} - ${wine.maturityEnd}</p></div>
        <div><p class="text-xs text-slate-500">Price / Value</p><p class="font-medium">${wine.price} / ${wine.value}</p></div>
        <div><p class="text-xs text-slate-500">Location</p><p class="font-medium font-mono">${wine.section}</p></div>
      `;
      
      document.getElementById('detailsModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('detailsModal').classList.add('hidden');
    }

    function openModifyMode() {
      alert("Modify mode activated! (You can replace this with a form injection using the exact same grid layout).");
    }

    function toggleFilterMenu() {
      const filterBar = document.getElementById('activeFiltersBar');
      filterBar.classList.toggle('hidden');
    }
  </script>
</body>
</html>
